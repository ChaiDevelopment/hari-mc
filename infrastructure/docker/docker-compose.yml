# PostgreSQL untuk mesin yang memiliki Docker (alternatif `pnpm db:dev`).
# Image API/Web production ditambahkan di Phase 7.
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
# Lalu set DATABASE_URL=postgresql://hmc:${POSTGRES_PASSWORD}@127.0.0.1:54329/hari_mc?schema=public
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hmc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: hari_mc
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmc -d hari_mc"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
