# Deploy website + CMS ke Cloudflare Workers — HANYA dijalankan manual (Actions → Deploy Web → Run workflow).
# Butuh GitHub Secrets: CLOUDFLARE_API_TOKEN (izin "Workers Scripts: Edit") dan CLOUDFLARE_ACCOUNT_ID.
# API_INTERNAL_URL diatur di wrangler.jsonc (vars) atau di dashboard Cloudflare.
name: Deploy Web (Cloudflare Workers)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build & deploy
        run: pnpm --filter @hmc/web cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
